# Specificatie van de synthetische populatie 2026.
#
# De structuur (huishoudtypes en leeftijden) komt uit CBS (data/kalibratie/2026.yaml). Dit bestand bevat de
# aannames waarmee binnen elke CBS-cel huishoudens worden gemaakt: inkomens, woning, kinderopvang.
# Daarna herweegt `npm run kalibreer` de populatie naar de kalibratiedoelen; het rapport in
# docs/kalibratie-2026.md laat zien hoe goed dat lukt. Deze aannames hoeven dus niet exact te kloppen, maar ze
# moeten wel genoeg variatie bieden.

bron: "Modelaannames (fase 3), afgestemd op de kalibratiedoelen. Zie docs/DECISIONS.md D-021."

# Aantal synthetische huishoudens (ongeveer) en minimum per CBS-cel. Cellen met minder echte huishoudens dan
# "minimaleCel" worden overgeslagen; hun gewicht gaat naar de rest van dezelfde samenstelling.
aantal: 4000
minimumPerCel: 3
minimaleCel: 1000
# Zaadje voor de toevalsgenerator: dezelfde waarde geeft altijd dezelfde populatie.
zaad: 2026

inkomen:
  # Mediaan bruto jaarinkomen van de hoofdverdiener tussen 40 en 55 jaar, en de verhouding per leeftijdsgroep.
  mediaanHoofdverdiener: 64000
  leeftijdsprofiel:
    - { vanaf: 15, factor: 0.25 }
    - { vanaf: 20, factor: 0.5 }
    - { vanaf: 25, factor: 0.75 }
    - { vanaf: 30, factor: 0.9 }
    - { vanaf: 35, factor: 1.0 }
    - { vanaf: 55, factor: 0.95 }
    - { vanaf: 60, factor: 0.85 }
  # Spreiding (sigma van de lognormale verdeling).
  spreiding: 0.55
  # Alleenstaanden en eenouders verdienen relatief minder dan de hoofdverdiener in een paar.
  factorAlleenstaand: 0.8
  factorEenouder: 0.65
  # Kans dat de partner werkt, en het mediane inkomen van de partner als deel van dat van de hoofdverdiener.
  partnerWerkt: 0.85
  partnerAandeel: 0.65
  # Samenhang tussen het inkomen van de hoofdverdiener en de partner (correlatie in de lognormale verdeling).
  partnerCorrelatie: 0.4
  # Kans op een uitkering in plaats van werk (hoofdverdiener), en het deel daarvan dat bijstand is. Bijstand volgt
  # uit de norm (bij een paar krijgen beide partners de helft van de gezinsnorm).
  uitkeringKans: { alleenstaand: 0.12, paar: 0.04, eenouder: 0.22 }
  aandeelBijstand: 0.5
  # Bruto WW- of WIA-uitkering per jaar: tussen minimum en maximum.
  uitkering: { minimum: 17000, maximum: 30000 }
  # Kans dat een werkende zelfstandig ondernemer is (anders werknemer), en de kans dat een ondernemer het
  # urencriterium haalt. De herweging stemt het aantal af op CBS. Wie pensioenpremie betaalt, bepaalt de
  # kalibratie per inkomensgroep (data/kalibratie, sectie pensioenpremie).
  zelfstandigKans: 0.13
  urencriteriumKans: 0.6

pensioen:
  # Aanvullend pensioen naast de AOW: mediaan en spreiding, per huishouden.
  mediaanAlleenstaand: 12000
  mediaanPaar: 21000
  spreiding: 0.9
  # Deel van het pensioen van een paar dat bij de hoofdverdiener hoort.
  aandeelHoofd: 0.65

woning:
  # Kans op een koopwoning: logistisch in leeftijd en inkomenspositie (0 = laagste, 1 = hoogste in de cel).
  koop: { basis: -0.6, perJaarLeeftijd: 0.035, inkomen: 3.0, alleenstaand: -0.9, maxLeeftijdEffect: 55 }
  # Van de huurders: kans op een corporatiewoning (anders particulier), dalend met het inkomen.
  corporatie: { basis: 0.8, inkomen: -2.6 }
  # Kale huur per maand: gelijkmatig tussen minimum en maximum.
  huurCorporatie: { minimum: 450, maximum: 900 }
  huurParticulier: { minimum: 750, maximum: 1600 }
  # WOZ-waarde en hypotheek van eigenaren.
  wozPerBrutoInkomen: 5.0
  # Spreiding rond die waarde: ±30% (gelijkmatig).
  wozSpreiding: 0.3
  wozMinimum: 200000
  wozMaximum: 2000000
  hypotheekPerBrutoInkomen: 4.0
  hypotheekMaximum: 800000
  # Spreiding van de hypotheek rond die waarde: ±60% (gelijkmatig).
  hypotheekSpreiding: 0.6
  # Deel van de oorspronkelijke hypotheek dat over is: daalt met de leeftijd tot nul rond deze leeftijd.
  hypotheekAfgelostOpLeeftijd: 75
  hypotheekrentePct: 3.4

kinderen:
  # Leeftijd van het oudste kind ≈ leeftijd referentiepersoon − dit verschil, met een spreiding; volgende
  # kinderen telkens "tussenruimte" jaar jonger.
  leeftijdsverschil: 31
  spreiding: 6
  tussenruimte: 2.5
  # Inkomen van meerderjarige thuiswonende kinderen. Tot "studieTotLeeftijd": een bijbaan (gelijkmatig tussen
  # minimum en maximum). Daarna werkt een deel ("werkKans", lognormaal inkomen), de rest heeft een bijbaan.
  inkomen:
    studieTotLeeftijd: 21
    bijbaan: { minimum: 1000, maximum: 12000 }
    werkKans: 0.7
    mediaanWerk: 30000
    spreiding: 0.5

kinderopvang:
  # Kans op kinderopvang als alle ouders werken en er een kind jonger dan 13 is.
  kans: 0.85
  dagopvang: { totLeeftijd: 4, urenPerMaand: 80 }
  buitenschoolse: { totLeeftijd: 13, urenPerMaand: 45 }
  # Uurprijs als factor van de maximale uurprijs (gelijkmatig tussen de twee waarden).
  uurprijsFactor: { minimum: 0.95, maximum: 1.15 }

# Herweging: grenzen voor de gewichten ten opzichte van het startgewicht.
herweging:
  minimaleFactor: 0.2
  maximaleFactor: 5
  iteraties: 200
