id: zonder-hra
naam: "Zonder hypotheekrenteaftrek"
omschrijving: "Het huidige stelsel, maar hypotheekrente is niet meer aftrekbaar. Het eigenwoningforfait blijft bestaan, met de bestaande aftrek voor wie geen of weinig hypotheekschuld heeft (Wet Hillen)."
uitleg: "Zonder hypotheekrenteaftrek betalen huiseigenaren met een hypotheek meer belasting. Het eigenwoningforfait blijft; wie weinig of geen schuld heeft, houdt de bestaande aftrek uit de Wet Hillen, waardoor het forfait grotendeels wegvalt."
volgorde: 40
wijzigingen:
  - { parameter: eigenWoning.aftrekMaxTarief, zet: 0 }
