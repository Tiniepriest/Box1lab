# Drie routes naar een meerderheid voor het Belastingplan 2027 (stand 3 november 2026). Besluit van de eigenaar:
# nu online, met aannames van Box1lab waar de partijen geen bedragen noemen, en zonder controle door een tweede
# persoon (D-063). Werk dit bij als er amendementen, een akkoord of een stemuitslag is.
id: belastingplan-2027
naam: "Belastingplan 2027: drie routes"
# Naam van het tabblad in het menu.
menu: "Belastingplan 2027"
soort: akkoord
# Stemming in de Tweede Kamer.
datum: 2026-11-12
basispad:
  jaar: 2027
  toelichting: "Het vergelijkingspunt is het Belastingplan 2027 van het kabinet zoals het bij de Kamer ligt (met de tweede nota van wijziging van 20 oktober). Die cijfers zijn voorlopig. Toeslagen, AOW, bijstand en kinderbijslag zijn geraamd met de gewone jaarlijkse verhoging, tot de officiële bedragen er zijn."
fictief: false
vierOgen: false
uitleg: "Het kabinet-Jetten (D66, VVD, CDA) heeft geen meerderheid voor het Belastingplan 2027. Op 3 november paste het het plan aan: € 347 miljoen extra koopkracht, zodat de vrijheidsbijdrage in 2027 wegvalt, en steun voor het amendement van ChristenUnie en 50PLUS. Met die partijen en de Groep Markuszower lijkt een meerderheid in de Tweede Kamer mogelijk; in de Eerste Kamer is steun van links (PRO en Volt) of rechts (JA21, BBB en SGP) nodig. Waar partijen geen bedragen noemen, vertalen wij hun belangrijkste wens naar een maatregel die het model kan doorrekenen. Bij elke route staat wat er niet in zit, zoals de dekking."
