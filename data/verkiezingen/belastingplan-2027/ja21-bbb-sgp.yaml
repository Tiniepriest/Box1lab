    toelichting: "De vrijheidsbijdrage van burgers is in het Belastingplan een beperkte inflatiecorrectie: 48% van de tabelcorrectiefactor 1,026, dus 1,01248 (memorie van toelichting). Schrappen betekent de volledige correctie. Wij verhogen daarom de geïndexeerde bedragen in box 1 (schijfgrens, heffingskortingen) met 1,026 ÷ 1,01248. De afbouwpunten die aan het minimumloon hangen en het aanvangspunt van het toptarief blijven gelijk. Volgens de memorie van toelichting levert de vrijheidsbijdrage van burgers € 1,5 miljard op; een deel daarvan zit in bedragen buiten box 1, zoals het heffingsvrij vermogen in box 3; die laten we gelijk. Het kabinet compenseert inmiddels € 347 miljoen (zie de route van het kabinet met ChristenUnie en 50PLUS); deze route gaat uit van de volledige inflatiecorrectie."
