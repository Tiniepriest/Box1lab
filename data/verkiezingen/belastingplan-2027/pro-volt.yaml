    toelichting: "PRO en Volt willen de lasten op arbeid verlagen, maar noemen (nog) geen bedrag of maatregel. Wij nemen aan dat ze de verhoging van de tarieven in de eerste en tweede schijf terugdraaien die het kabinet voor 2027 voorstelt als dekking voor de compensatie van de zorgpremies: 0,57 procentpunt ('besluitvorming 2027' in tabel 5 en 6 van de memorie van toelichting). Een andere invulling kan een heel ander beeld geven."
niet_gemodelleerd:
  - "Grote vermogens zwaarder belasten als dekking: nog geen voorstel met bedragen, en box 2 zit niet in het model. Het saldo voor de overheid is dus zonder dekking."
  - "De verschuiving van € 8 miljard die Jesse Klaver eerder noemde: geen uitgewerkt voorstel, en hij heeft aangegeven tot een compromis bereid te zijn."
  - "Eigen amendementen bij het debat van 4 november: nog niet bekend."
