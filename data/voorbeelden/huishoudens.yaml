  - id: kinderopvang
    label: "Tweeverdieners, kinderopvang"
    omschrijving: "2 kleine kinderen (1 en 3), € 18.000 kinderopvang per jaar, huur € 1.200 per maand"
    invoer:
      {
        inkomen1: 45000,
        soort1: werk,
        soort2: werk,
        inkomen2: 35000,
        kinderLeeftijden: [1, 3],
        huurPerMaand: 1200,
        hypotheekrente: 0,
        woz: 0,
        kinderopvangKosten: 18000,
      }
  - id: gezin-tweeverdieners
    label: "Gezin, tweeverdieners"
    omschrijving: "2 kinderen (4 en 8), koopwoning"
    invoer:
      {
        inkomen1: 62000,
        soort1: werk,
        soort2: werk,
        inkomen2: 40000,
        kinderLeeftijden: [4, 8],
        huurPerMaand: 0,
        hypotheekrente: 12000,
        woz: 500000,
        kinderopvangKosten: 0,
      }
  - id: tweeverdieners-hoog
    label: "Tweeverdieners zonder kinderen"
    omschrijving: "Hoge inkomens, koopwoning"
    invoer:
      {
        inkomen1: 110000,
        soort1: werk,
        soort2: werk,
        inkomen2: 60000,
        kinderLeeftijden: [],
        huurPerMaand: 0,
        hypotheekrente: 15000,
        woz: 650000,
        kinderopvangKosten: 0,
      }
  - id: topinkomen
    label: "Topinkomen"
    omschrijving: "Paar, koopwoning, € 500.000 spaargeld en beleggingen"
    invoer:
      {
        inkomen1: 350000,
        soort1: werk,
        soort2: werk,
        inkomen2: 50000,
        kinderLeeftijden: [],
        huurPerMaand: 0,
        hypotheekrente: 20000,
        woz: 1200000,
        kinderopvangKosten: 0,
        vermogen: 500000,
      }

# Huishoudtypes voor de grafieken "netto inkomen en marginale druk" in het lab. Het inkomen van de eerste persoon
# loopt van laag naar hoog; bij tweeverdieners verdient de partner steeds "partnerAandeel" daarvan.
curves:
  - id: alleenstaand-huur
    label: "Alleenstaand, huur € 850 per maand"
    invoer:
      {
        inkomen1: 0,
        soort1: werk,
        soort2: null,
        inkomen2: 0,
        kinderLeeftijden: [],
        huurPerMaand: 850,
        hypotheekrente: 0,
        woz: 0,
        kinderopvangKosten: 0,
      }
  - id: eenouder
    label: "Eenoudergezin, 1 kind van 6, huur € 850 per maand"
    invoer:
      {
        inkomen1: 0,
        soort1: werk,
        soort2: null,
        inkomen2: 0,
        kinderLeeftijden: [6],
        huurPerMaand: 850,
        hypotheekrente: 0,
        woz: 0,
        kinderopvangKosten: 0,
      }
  - id: alleenverdiener
    label: "Alleenverdiener, partner zonder inkomen, 2 kinderen, huur € 950 per maand"
    invoer:
      {
        inkomen1: 0,
        soort1: werk,
        soort2: geen,
        inkomen2: 0,
        kinderLeeftijden: [5, 9],
        huurPerMaand: 950,
        hypotheekrente: 0,
        woz: 0,
        kinderopvangKosten: 0,
      }
  - id: tweeverdieners-koop
    label: "Tweeverdieners 60/40, 2 kinderen, koopwoning (WOZ € 400.000, rente € 8.000)"
    partnerAandeel: 0.667
    invoer:
      {
        inkomen1: 0,
        soort1: werk,
        soort2: werk,
        inkomen2: 0,
        kinderLeeftijden: [5, 9],
        huurPerMaand: 0,
        hypotheekrente: 8000,
        woz: 400000,
        kinderopvangKosten: 0,
      }
