        kinderLeeftijden: [],
        huurPerMaand: 850,
        hypotheekrente: 0,
        woz: 0,
        kinderopvangKosten: 0,
      }
  - id: p50
    label: P50
    omschrijving: "Stel, 2 kinderen, koop"
    invoer:
      {
        inkomen1: 48000,
        soort1: werk,
        soort2: werk,
        inkomen2: 22000,
        kinderLeeftijden: [4, 8],
        huurPerMaand: 0,
        hypotheekrente: 9000,
        woz: 400000,
        kinderopvangKosten: 0,
      }
  - id: p75
    label: P75
    omschrijving: "Stel, 2 kinderen, koop"
    invoer:
      {
        inkomen1: 62000,
        soort1: werk,
        soort2: werk,
