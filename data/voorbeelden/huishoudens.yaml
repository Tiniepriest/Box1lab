# Voorbeeldhuishoudens, getoond in het scenariolab ("Wat betekent het voor deze huishoudens?"). Ingedeeld naar
# soort huishouden, niet naar inkomenspercentiel (D-094). Modaal: € 48.000, zie de bron bij "loon" in de parameters.
# Bedragen per jaar, huur per maand. "soort2: null" betekent geen partner.
# Soorten inkomen: werk, uitkering, aow, geen. Werkenden zijn werknemers met de standaard pensioenpremie.
# Bij bijstand volgt het bedrag uit de bijstandsnorm; inkomen1/inkomen2 tellen dan niet.

huishoudens:
  - id: bijstand-alleenstaand
    label: "Bijstand, alleenstaand"
    omschrijving: "Huur € 750 per maand"
    invoer:
      {
        inkomen1: 0,
        soort1: uitkering,
        soort2: null,
        inkomen2: 0,
        kinderLeeftijden: [],
        huurPerMaand: 750,
        hypotheekrente: 0,
        woz: 0,
        kinderopvangKosten: 0,
        uitkeringSoort: bijstand,
      }
  - id: bijstand-eenouder
    label: "Bijstand, eenoudergezin"
    omschrijving: "2 kinderen (5 en 9), huur € 800 per maand"
    invoer:
      {
        inkomen1: 0,
        soort1: uitkering,
        soort2: null,
        inkomen2: 0,
        kinderLeeftijden: [5, 9],
        huurPerMaand: 800,
        hypotheekrente: 0,
        woz: 0,
        kinderopvangKosten: 0,
        uitkeringSoort: bijstand,
      }
  - id: bijstand-gezin
    label: "Bijstand, paar met kinderen"
    omschrijving: "2 kinderen (4 en 8), huur € 900 per maand"
    invoer:
      {
        inkomen1: 0,
        soort1: uitkering,
        soort2: uitkering,
        inkomen2: 0,
        kinderLeeftijden: [4, 8],
        huurPerMaand: 900,
        hypotheekrente: 0,
        woz: 0,
        kinderopvangKosten: 0,
        uitkeringSoort: bijstand,
      }
  - id: ww
    label: "WW-uitkering, alleenstaand"
    omschrijving: "Huur € 850 per maand"
    invoer:
      {
        inkomen1: 24000,
        soort1: uitkering,
        soort2: null,
        inkomen2: 0,
        kinderLeeftijden: [],
        huurPerMaand: 850,
        hypotheekrente: 0,
        woz: 0,
        kinderopvangKosten: 0,
        uitkeringSoort: werknemersverzekering,
      }
  - id: aow-alleenstaand
    label: "AOW'er, alleenstaand"
    omschrijving: "AOW en een klein pensioen, huur € 650 per maand"
    invoer:
      {
        inkomen1: 25000,
        soort1: aow,
        soort2: null,
        inkomen2: 0,
        kinderLeeftijden: [],
        huurPerMaand: 650,
        hypotheekrente: 0,
        woz: 0,
        kinderopvangKosten: 0,
      }
  - id: aow-stel
    label: "AOW'ers, paar"
    omschrijving: "AOW en pensioen, koopwoning zonder hypotheek, € 150.000 spaargeld"
    invoer:
      {
        inkomen1: 32000,
        soort1: aow,
        soort2: aow,
        inkomen2: 22000,
        kinderLeeftijden: [],
        huurPerMaand: 0,
        hypotheekrente: 0,
        woz: 400000,
        kinderopvangKosten: 0,
        vermogen: 150000,
      }
  - id: laag-loon
    label: "Alleenstaand, laag loon"
    omschrijving: "Huur € 800 per maand"
    invoer:
      {
        inkomen1: 28000,
        soort1: werk,
        soort2: null,
        inkomen2: 0,
        kinderLeeftijden: [],
        huurPerMaand: 800,
        hypotheekrente: 0,
        woz: 0,
        kinderopvangKosten: 0,
      }
  - id: eenouder-werkend
    label: "Eenoudergezin, werkend"
    omschrijving: "1 kind (6), huur € 850 per maand"
    invoer:
      {
        inkomen1: 32000,
        soort1: werk,
        soort2: null,
        inkomen2: 0,
        kinderLeeftijden: [6],
        huurPerMaand: 850,
        hypotheekrente: 0,
        woz: 0,
        kinderopvangKosten: 0,
      }
  - id: modaal-alleenstaand
    label: "Alleenstaand, modaal"
    omschrijving: "Modaal inkomen (CPB), huur € 1.100 per maand"
    invoer:
      {
        inkomen1: 48000,
        soort1: werk,
        soort2: null,
        inkomen2: 0,
        kinderLeeftijden: [],
        huurPerMaand: 1100,
        hypotheekrente: 0,
        woz: 0,
        kinderopvangKosten: 0,
      }
  - id: alleenverdiener
    label: "Alleenverdiener, 2 kinderen"
    omschrijving: "Partner zonder inkomen, kinderen 5 en 9, huur € 950 per maand"
    invoer:
      {
        inkomen1: 48000,
        soort1: werk,
        soort2: geen,
        inkomen2: 0,
        kinderLeeftijden: [5, 9],
        huurPerMaand: 950,
        hypotheekrente: 0,
        woz: 0,
        kinderopvangKosten: 0,
      }
  - id: gezin-koop
    label: "Gezin, anderhalfverdieners"
    omschrijving: "2 kinderen (4 en 8), koopwoning"
    invoer:
      {
        inkomen1: 48000,
        soort1: werk,
        soort2: werk,
        inkomen2: 22000,
        kinderLeeftijden: [4, 8],
        huurPerMaand: 0,
        hypotheekrente: 9000,
        woz: 400000,
        kinderopvangKosten: 0,
