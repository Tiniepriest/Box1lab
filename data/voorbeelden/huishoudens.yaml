# Voorbeeldhuishoudens, getoond in het scenariolab. Overgenomen uit het prototype.
# Bedragen per jaar, huur per maand. "soort2: null" betekent geen partner.
# Soorten inkomen: werk, uitkering, aow, geen. Werkenden zijn werknemers met de standaard pensioenpremie.
# Bij bijstand volgt het bedrag uit de bijstandsnorm; inkomen1/inkomen2 tellen dan niet.

huishoudens:
  - id: p10
    label: P10
    omschrijving: "Alleenstaand, bijstand, huur"
    invoer:
      {
        inkomen1: 0,
        soort1: uitkering,
        soort2: null,
        inkomen2: 0,
        kinderLeeftijden: [],
        huurPerMaand: 750,
        hypotheekrente: 0,
        woz: 0,
        kinderopvangKosten: 0,
        uitkeringSoort: bijstand,
      }
  - id: p20
    label: P20
    omschrijving: "AOW'er alleenstaand, huur"
    invoer:
      {
        inkomen1: 25000,
        soort1: aow,
        soort2: null,
        inkomen2: 0,
        kinderLeeftijden: [],
        huurPerMaand: 650,
        hypotheekrente: 0,
        woz: 0,
        kinderopvangKosten: 0,
      }
  - id: p30
    label: P30
    omschrijving: "Alleenstaand werkend, huur"
    invoer:
      {
        inkomen1: 32000,
        soort1: werk,
        soort2: null,
