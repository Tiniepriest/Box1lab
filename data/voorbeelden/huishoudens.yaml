        woz: 0,
        kinderopvangKosten: 18000,
      }
  - id: gezin-tweeverdieners
    label: "Gezin, tweeverdieners"
    omschrijving: "2 kinderen, koophuis"
    invoer:
      {
        inkomen1: 62000,
        soort1: werk,
        soort2: werk,
        inkomen2: 40000,
        kinderLeeftijden: [4, 8],
        huurPerMaand: 0,
        hypotheekrente: 12000,
        woz: 500000,
        kinderopvangKosten: 0,
      }
  - id: tweeverdieners-hoog
    label: "Tweeverdieners zonder kinderen"
    omschrijving: "Koophuis"
    invoer:
      {
        inkomen1: 110000,
        soort1: werk,
        soort2: werk,
        inkomen2: 60000,
        kinderLeeftijden: [],
