# Publieke lijst van wijzigingen, getoond op /wijzigingen. Nieuwste bovenaan.
#
# Voeg een regel toe bij elke wijziging die bezoekers merken: nieuwe cijfers (jaarlijkse update), andere
# rekenregels, een nieuwe pagina, en altijd bij een correctie. Veranderen de rekenregels, verhoog dan MODEL_VERSIE
# in packages/engine/src/versie.ts en zet die versie hier bij `modelversie`; `npm run valideer` controleert dat.
#
# soort: nieuw | cijfers | model | correctie

- datum: 2026-11-04
  soort: nieuw
  titel: "Van bruto naar wat je overhoudt"
  tekst: >-
    Boven het bedrag dat je per maand overhoudt, staat nu kort hoe je daar komt: je bruto inkomen per jaar, hoeveel
    belasting je betaalt, en hoeveel toeslagen je krijgt als je die hebt. De premie van je zorgverzekering gaat
    niet meer af van het bedrag bovenaan: dat is geen belasting, maar een vaste uitgave, net als je huur. Het bedrag
    bovenaan is daardoor ongeveer € 157 per maand per volwassene hoger. Bij de vergelijkingen tussen voorstellen
    verandert niets.

- datum: 2026-11-04
  soort: nieuw
  titel: "Je situatie blijft onthouden"
  tekst: >-
    Wat je op Jouw situatie invult, staat er de volgende keer nog, ook als je het tabblad sluit. Het blijft in je
    eigen browser; er gaat niets naar een server. Op een computer die je deelt, zet je onderaan het formulier
    "Onthoud op dit apparaat" uit, of je wist je gegevens.

- datum: 2026-11-04
  soort: nieuw
  titel: "Box 3 apart van wat je overhoudt"
  tekst: >-
    Het bedrag bovenaan Jouw situatie, wat je per maand overhoudt, gaat nu alleen over je inkomen. De box 3-belasting
    over je spaargeld en beleggingen staat er apart onder. Het rendement dat de Belastingdienst aanneemt, krijg je
    meestal niet echt op je rekening; daarom tellen we het niet als inkomen, en de belasting erover ook niet. Bij de
    verschillen tussen voorstellen en jaren telt de box 3-belasting wel mee.

- datum: 2026-11-04
  soort: nieuw
  titel: "Hypotheekrente per maand"
  tekst: >-
    Op Jouw situatie vul je de hypotheekrente nu per maand in, in plaats van per jaar. Weet je alleen wat je in
    totaal aan de bank betaalt (rente plus aflossing)? Vul dan in hoeveel hypotheek je nog hebt en wat je rente is,
    dan rekenen we de rente per maand voor je uit.

- datum: 2026-11-04
  soort: nieuw
  titel: "Jouw situatie: klopt het met je loonstrook?"
  tekst: >-
    Op Jouw situatie zie je nu wat er ongeveer op je loonstrook staat: je netto loon per maand, en apart wat je
    vakantiegeld, 13e maand en bonus netto opleveren. Zo kun je de berekening naast je eigen loonstrook leggen. Het
    bedrag bovenaan blijft een gemiddelde over het hele jaar, met toeslagen en zorgpremie.

- datum: 2026-11-03
  soort: model
  modelversie: 0.5.0
  titel: "Box 3: belasting op sparen en beleggen"
  tekst: >-
    Box 3 zit nu in de berekening. Op Jouw situatie vul je spaargeld, beleggingen en schulden apart in, en zie je
    hoeveel box 3-belasting je betaalt, in 2026 en volgens het Belastingplan in 2027. De nagebootste bevolking heeft
    nu ook vermogen, volgens het CBS. Daardoor werkt de vermogensgrens van de toeslagen ook voor heel Nederland, en
    kun je in het Scenariolab het heffingsvrij vermogen en het tarief van box 3 veranderen. Omdat de bevolking
    opnieuw is herwogen, veranderen de uitkomsten van de voorstellen een beetje: een vlaktaks van 35% kost nu
    ongeveer € 2,5 miljard per jaar, in plaats van € 2,8 miljard.

- datum: 2026-11-03
  soort: nieuw
  titel: "Jouw situatie: wat als…?"
  tekst: >-
    Op Jouw situatie zie je nu wat je per maand meer of minder overhoudt als er iets verandert: € 100 opslag, een
    dag minder werken (ook voor je partner), samenwonen met iemand met een modaal inkomen of een kind erbij. Daarbij
    staat hoeveel daarvan door belasting en hoeveel door toeslagen komt.

- datum: 2026-11-03
  soort: model
  modelversie: 0.4.0
  titel: "Scenariolab: basisinkomen en negatieve belasting"
  tekst: >-
    In het Scenariolab kun je nu een basisinkomen per volwassene instellen en negatieve belasting aanzetten: wie
    minder verdient dan de belastingvrije voet, of meer korting heeft dan belasting, krijgt het verschil
    uitbetaald. Samen met een vlaktaks is dat de negatieve inkomstenbelasting van Milton Friedman. Het lab begint
    nu rustiger: zolang je niets verandert, zie je geen blokken vol nullen. De uitkomsten van de bestaande
    voorstellen veranderen niet.

- datum: 2026-11-03
  soort: nieuw
  titel: "Belastingplan 2027: derde route en uitleg per onderdeel"
  tekst: >-
    Het kabinet paste op 3 november het Belastingplan 2027 aan en steunt het voorstel van ChristenUnie en 50PLUS:
    lagere tarieven in de eerste twee schijven, de ouderenkorting niet lager en de arbeidskorting minder hoog. Dat
    staat nu als derde route op de pagina, samen met € 347 miljoen extra koopkracht. Bij stap 1 zie je nu ook waar
    het verschil tussen 2026 en 2027 vandaan komt, per onderdeel: tarieven, kortingen, zorgpremie, toeslagen.

- datum: 2026-11-02
  soort: nieuw
  titel: Nieuw uiterlijk
  tekst: >-
    De site heeft een rustiger uiterlijk gekregen, ook in de donkere modus. Erop vooruit is nu groen en erop
    achteruit rood, in alle grafieken. De kleuren zijn zo gekozen dat ze ook bij kleurenblindheid van elkaar te
    onderscheiden zijn, en bedragen houden hun plus- of minteken. De berekeningen zijn niet veranderd.

- datum: 2026-11-02
  soort: correctie
  titel: Meer hoge inkomens in de nagebootste bevolking
  tekst: >-
    De nagebootste bevolking had te weinig heel hoge inkomens: het hoogste inkomen was € 254.000. Nu klopt de
    top met het CBS: hoeveel mensen meer dan € 100.000 en meer dan € 200.000 verdienen, en hoeveel die hoogste
    groep samen verdient. Daardoor veranderen de uitkomsten voor de hoogste inkomensgroep. Een vlaktaks van 35%
    kost de overheid nu ongeveer € 2,8 miljard per jaar, in plaats van € 1,7 miljard.

- datum: 2026-11-02
  soort: nieuw
  titel: Ook wie ongeveer gelijk blijft
  tekst: >-
    In het Scenariolab en bij de voorstellen staat naast wie erop achteruit en vooruit gaat nu ook welk deel
    ongeveer gelijk blijft: minder dan 1% verschil in wat je te besteden hebt.

- datum: 2026-11-02
  soort: nieuw
  titel: Vlaktaks nu 35% boven € 24.000
  tekst: >-
    Het voorstel voor een vlaktaks heeft nu één tarief van 35% boven een belastingvrije voet van € 24.000 per
    persoon, in plaats van 40% boven € 18.000. Dat kost de overheid ongeveer € 1,7 miljard per jaar, in plaats
    van dat het € 41 miljard oplevert. Het oude adres van het voorstel stuurt door naar het nieuwe.

- datum: 2026-11-02
  soort: nieuw
  titel: Sneller en duidelijker op je telefoon
  tekst: >-
    Op Jouw situatie zie je op een telefoon onderaan meteen wat je overhoudt, ook terwijl je invult. De vragen
    staan boven de invulvelden. Bij je inkomen zijn er vinkjes voor vakantiegeld en een 13e maand, en
    een vakje voor een bonus, zonder lange uitleg. Het voorbeeld is nu iemand met een modaal inkomen, en er staat duidelijk bij dat
    het een voorbeeld is. De pagina laadt sneller, omdat de nagebootste bevolking daar niet meer nodig is. De
    pagina over het Belastingplan 2027 en de voorstellen hebben een knop om de pagina te delen; alleen de link
    gaat mee, nooit wat je hebt ingevuld.

- datum: 2026-11-02
  soort: cijfers
  titel: Betere bedragen voor 2027
  tekst: >-
    Voor 2027 rekenen we nu met de zorgtoeslag, zorgpremie, huurtoeslag, het kindgebonden budget, de
    kinderbijslag, AOW en bijstand zoals ze waarschijnlijk worden: met de officiële bedragen waar die er al zijn
    (minimumloon, percentages zorgtoeslag) en anders met de gewone jaarlijkse verhoging. Eerder stonden die op
    het niveau van 2026. De officiële bedragen volgen in november en december; dan werken we ze bij.

- datum: 2026-11-02
  soort: nieuw
  titel: Belastingplan 2027 op één pagina
  tekst: >-
    Op de pagina Belastingplan 2027 zie je eerst wat het plan van het kabinet voor jou betekent ten opzichte van
    2026 (stap 1), en dan wat de routes van links en rechts daaraan veranderen (stap 2). Op Jouw situatie staat
    onder de uitkomst een volgende stap, met een korte samenvatting voor 2027.

- datum: 2026-11-02
  soort: nieuw
  titel: Je situatie blijft in beeld
  tekst: >-
    Bij het Belastingplan 2027, in het Scenariolab en bij elk voorstel staat links (op een telefoon bovenaan)
    met welke situatie we rekenen en wat je nu overhoudt. Pas je het daar aan, dan rekent alles op de pagina
    meteen mee. Zonder eigen situatie staat er dat we met een voorbeeld rekenen.

- datum: 2026-11-02
  soort: nieuw
  titel: Nieuw menu
  tekst: >-
    Bovenaan staan nu tabbladen voor de pagina's waar je rekent: Jouw situatie, Belastingplan 2027 en het
    Scenariolab. De kant-en-klare voorstellen vind je in het Scenariolab. Uitleg, Methodiek en Over staan
    rechtsboven, op een telefoon onder "Meer".

- datum: 2026-11-02
  soort: nieuw
  titel: "Belastingplan 2027: twee routes vergeleken"
  tekst: >-
    Het kabinet zoekt steun voor het Belastingplan 2027 bij PRO en Volt of bij JA21, BBB en SGP. Een nieuwe pagina
    zet die twee routes naast elkaar: wat betekenen ze voor jou en voor Nederland? De partijen noemen nog weinig
    bedragen; de vertaling naar maatregelen is van ons en staat er per maatregel bij.

- datum: 2026-10-28
  soort: cijfers
  titel: Wat verandert er in 2027? (voorlopig)
  tekst: >-
    Op Jouw situatie zie je wat de plannen voor 2027 voor jou betekenen, bij hetzelfde bruto inkomen. Voorlopig:
    gebaseerd op het Belastingplan 2027 zoals het nu bij de Tweede Kamer ligt (tarieven, heffingskortingen,
    zelfstandigenaftrek). Toeslagen, AOW, bijstand, kinderbijslag en zorgpremie voor 2027 zijn nog niet bekend;
    daarvoor rekenen we tijdelijk met de bedragen van 2026.

- datum: 2026-10-28
  soort: nieuw
  titel: Zie wat een scenario of voorstel voor jou betekent
  tekst: >-
    In het scenariolab en op de pagina van elk voorstel staat nu "Wat betekent dit voor jou?", naast de cijfers
    voor heel Nederland. Op Jouw situatie zie je wat alle voorstellen met jouw huishouden doen.

- datum: 2026-10-28
  soort: model
  modelversie: 0.3.0
  titel: Bijstand, zzp'ers en pensioenpremie
  tekst: >-
    De bijstand volgt nu uit de landelijke norm in plaats van een zelf in te vullen bedrag. Voor zzp'ers rekenen
    we de zelfstandigenaftrek, de startersaftrek, de mkb-winstvrijstelling en de eigen bijdrage voor de
    zorgverzekering. Werknemers kunnen hun eigen pensioenpremie invullen; die verlaagt de belasting, maar ook wat
    je overhoudt. De nagebootste bevolking heeft nu zelfstandigen en pensioenpremie volgens CBS (wie betaalt en
    hoeveel, per inkomensgroep en leeftijd) en is opnieuw gewogen; de belastingopbrengst in het model komt
    daardoor uit op het niveau van de Miljoenennota.

- datum: 2026-10-28
  soort: nieuw
  titel: Eenvoudiger formulier, en je situatie gaat mee
  tekst: >-
    Je situatie blijft bewaard zolang je tabblad openstaat, zodat je hem ook in het lab en bij de voorstellen
    ziet. Nieuw: een veld voor een 13e maand of bonus. Zzp'ers krijgen geen vakantiegeld meer bijgeteld. "Weet ik
    niet" en "Anders" bij wonen zijn weg; in plaats daarvan staat erbij waar je de bedragen vindt.

- datum: 2026-10-28
  soort: cijfers
  titel: Overige aftrekposten met bron
  tekst: >-
    De aftrekposten die we niet per huishouden berekenen (giften, zorgkosten, lijfrente, ondernemersaftrek) tellen
    nu mee met de bedragen uit de Miljoenennota: € 6,0 miljard in plaats van een schatting van € 4 miljard.
    Alleen voorstellen die deze aftrekposten afschaffen, veranderen daardoor.

- datum: 2026-10-27
  soort: nieuw
  titel: Lijst van wijzigingen en "Meld een fout"
  tekst: >-
    Deze pagina laat zien wat er aan de site is veranderd. Onderaan elke pagina staat een knop om een fout te
    melden.
  links:
    - { tekst: Pull request, url: "https://github.com/Tiniepriest/Box1lab/pull/8" }

- datum: 2026-10-27
  soort: nieuw
  titel: Verkiezingsmodule (voorbeeld)
  tekst: >-
    Een opzet om verkiezingsprogramma's door te rekenen, met bronnen per maatregel en controle door twee
    personen. Voorlopig alleen met verzonnen partijen, om de werkwijze te testen.
  links:
    - { tekst: Pull request, url: "https://github.com/Tiniepriest/Box1lab/pull/7" }

- datum: 2026-10-27
  soort: nieuw
  titel: Voorstellen, uitleg en vergelijken
  tekst: >-
    Acht doorgerekende voorstellen met een eigen pagina, vijf uitlegartikelen met een rekenvoorbeeld, en in het
    lab je eigen scenario naast een voorstel zetten.
  links:
    - { tekst: Pull request, url: "https://github.com/Tiniepriest/Box1lab/pull/6" }

- datum: 2026-10-27
  soort: nieuw
  titel: Eerste versie van de site
  tekst: >-
    De calculator voor je eigen situatie, het scenariolab en de pagina's Methodiek en Over.
  links:
    - { tekst: Pull request, url: "https://github.com/Tiniepriest/Box1lab/pull/5" }

- datum: 2026-10-26
  soort: cijfers
  titel: Bevolking op basis van CBS-cijfers
  tekst: >-
    De voorbeeldbevolking van ruim 4.000 huishoudens is opgebouwd uit CBS-cijfers en zo gewogen dat aantallen,
    inkomens en toeslagen kloppen met CBS en Dienst Toeslagen.
  links:
    - { tekst: Pull request, url: "https://github.com/Tiniepriest/Box1lab/pull/4" }

- datum: 2026-10-26
  soort: model
  modelversie: 0.2.0
  titel: Rekenregels volgens de officiële regels van 2026
  tekst: >-
    De toeslagen, de heffingskortingen, de eigen woning, de AOW en de kinderbijslag rekenen nu zoals de
    Belastingdienst en Dienst Toeslagen dat doen.
  links:
    - { tekst: Pull request, url: "https://github.com/Tiniepriest/Box1lab/pull/3" }

