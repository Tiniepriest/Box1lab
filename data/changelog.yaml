# Publieke lijst van wijzigingen, getoond op /wijzigingen. Nieuwste bovenaan.
#
# Voeg een regel toe bij elke wijziging die bezoekers merken: nieuwe cijfers (jaarlijkse update), andere
# rekenregels, een nieuwe pagina, en altijd bij een correctie. Veranderen de rekenregels, verhoog dan MODEL_VERSIE
# in packages/engine/src/versie.ts en zet die versie hier bij `modelversie`; `npm run valideer` controleert dat.
#
# soort: nieuw | cijfers | model | correctie

- datum: 2026-11-02
  soort: nieuw
  titel: Je situatie blijft in beeld
  tekst: >-
    Bij het Belastingplan 2027, in het Scenariolab en bij elk voorstel staat links (op een telefoon bovenaan)
    met welke situatie we rekenen en wat je nu overhoudt. Pas je het daar aan, dan rekent alles op de pagina
    meteen mee. Zonder eigen situatie staat er dat we met een voorbeeld rekenen.

- datum: 2026-11-02
  soort: nieuw
  titel: Nieuw menu
  tekst: >-
    Bovenaan staan nu tabbladen voor de pagina's waar je rekent: Jouw situatie, Belastingplan 2027 en het
    Scenariolab. De kant-en-klare voorstellen vind je in het Scenariolab. Uitleg, Methodiek en Over staan
    rechtsboven, op een telefoon onder "Meer".

- datum: 2026-11-02
  soort: nieuw
  titel: "Belastingplan 2027: twee routes vergeleken"
  tekst: >-
    Het kabinet zoekt steun voor het Belastingplan 2027 bij PRO en Volt of bij JA21, BBB en SGP. Een nieuwe pagina
    zet die twee routes naast elkaar: wat betekenen ze voor jou en voor Nederland? De partijen noemen nog weinig
    bedragen; de vertaling naar maatregelen is van ons en staat er per maatregel bij.

- datum: 2026-10-28
  soort: cijfers
  titel: Wat verandert er in 2027? (voorlopig)
  tekst: >-
    Op Jouw situatie zie je wat de plannen voor 2027 voor jou betekenen, bij hetzelfde bruto inkomen. Voorlopig:
    gebaseerd op het Belastingplan 2027 zoals het nu bij de Tweede Kamer ligt (tarieven, heffingskortingen,
    zelfstandigenaftrek). Toeslagen, AOW, bijstand, kinderbijslag en zorgpremie voor 2027 zijn nog niet bekend;
    daarvoor rekenen we tijdelijk met de bedragen van 2026.

- datum: 2026-10-28
  soort: nieuw
  titel: Zie wat een scenario of voorstel voor jou betekent
  tekst: >-
    In het scenariolab en op de pagina van elk voorstel staat nu "Wat betekent dit voor jou?", naast de cijfers
    voor heel Nederland. Op Jouw situatie zie je wat alle voorstellen met jouw huishouden doen.

- datum: 2026-10-28
  soort: model
  modelversie: 0.3.0
  titel: Bijstand, zzp'ers en pensioenpremie
  tekst: >-
    De bijstand volgt nu uit de landelijke norm in plaats van een zelf in te vullen bedrag. Voor zzp'ers rekenen
    we de zelfstandigenaftrek, de startersaftrek, de mkb-winstvrijstelling en de eigen bijdrage voor de
    zorgverzekering. Werknemers kunnen hun eigen pensioenpremie invullen; die verlaagt de belasting, maar ook wat
    je overhoudt. De nagebootste bevolking heeft nu zelfstandigen en pensioenpremie volgens CBS (wie betaalt en
    hoeveel, per inkomensgroep en leeftijd) en is opnieuw gewogen; de belastingopbrengst in het model komt
    daardoor uit op het niveau van de Miljoenennota.

- datum: 2026-10-28
  soort: nieuw
  titel: Eenvoudiger formulier, en je situatie gaat mee
  tekst: >-
    Je situatie blijft bewaard zolang je tabblad openstaat, zodat je hem ook in het lab en bij de voorstellen
    ziet. Nieuw: een veld voor een 13e maand of bonus. Zzp'ers krijgen geen vakantiegeld meer bijgeteld. "Weet ik
    niet" en "Anders" bij wonen zijn weg; in plaats daarvan staat erbij waar je de bedragen vindt.

- datum: 2026-10-28
  soort: cijfers
  titel: Overige aftrekposten met bron
  tekst: >-
    De aftrekposten die we niet per huishouden berekenen (giften, zorgkosten, lijfrente, ondernemersaftrek) tellen
    nu mee met de bedragen uit de Miljoenennota: € 6,0 miljard in plaats van een schatting van € 4 miljard.
    Alleen voorstellen die deze aftrekposten afschaffen, veranderen daardoor.

