# Bewoonde woningen naar eigendom op 1 januari 2025 (nieuwste jaar). Gebruikt als verdeling over huishoudens.
woningen:
  bron: "CBS StatLine 82900NED, Voorraad woningen; eigendom, type verhuurder, bewoning, 1 januari 2025 (https://opendata.cbs.nl/statline/#/CBS/nl/dataset/82900NED)"
  koop: 4609703
  corporatie: 2256069
  particulier: 1046800

# Grenzen van de 10%-groepen van het besteedbaar huishoudinkomen (particuliere huishoudens incl. studenten),
# in euro per jaar, voor 2024 (voorlopig, nieuwste jaar). Ze worden naar 2026 geïndexeerd met de factor hieronder.
inkomen:
  bron: "CBS StatLine 83934NED, Welvaart; grenzen van 10%-groepen inkomen & vermogen, 2024 (https://opendata.cbs.nl/statline/#/CBS/nl/dataset/83934NED)"
  jaar: 2024
  besteedbaarPercentielen: [20900, 27500, 33500, 39900, 47600, 57300, 68500, 81600, 102100]

# Inkomensbestanddelen van alle particuliere huishoudens in 2024 (CBS), in miljoen euro.
# - inkomenEigenWoning: het voordeel van wonen in een eigen woning (huurwaarde) dat CBS meetelt in het
#   besteedbaar inkomen; betaaldeHypotheekrente wordt daarvan afgetrokken. Om het model te kunnen vergelijken
#   met de CBS-decielgrenzen, telt de kalibratie dit voordeel (naar rato van de WOZ-waarde) en de rente mee.
# - belastingOpInkomen en premiesVolksverzekeringen: ter controle van de belastingopbrengst van huishoudens.
# - pensioenpremieWerknemer en inkomenZelfstandigOndernemer: ter controle van de pensioenpremie en de winst.
# - huishoudensMetZelfstandigOndernemer: marge voor het aantal huishoudens met een zelfstandige.
inkomensbestanddelen:
  bron: "CBS StatLine 84493NED, Inkomen van huishoudens; inkomensbestanddelen, huishoudenskenmerken, 2024: posten 3.1.2.1, 3.2.1, 13, 11.4.3, 12.3, 11.4.1.1 en 2.1 (https://opendata.cbs.nl/statline/#/CBS/nl/dataset/84493NED)"
  jaar: 2024
  inkomenEigenWoningMln: 38279
  betaaldeHypotheekrenteMln: 23331
  belastingOpInkomenMln: 103255
  # 26.097 (premie pensioen: volksverzekeringen) + 16.837 (premie ziektekosten: volksverzekeringen)
  premiesVolksverzekeringenMln: 42934
  # 11.4.1.1 Premie pensioen: werknemer
  pensioenpremieWerknemerMln: 19163
  # 2.1 Inkomen zelfstandig ondernemer: totaal en aantal huishoudens met dit inkomen
  inkomenZelfstandigOndernemerMln: 59381
  huishoudensMetZelfstandigOndernemer: 1189600

# Pensioenpremie van werknemers: wie betaalt, en hoeveel, per 10%-groep gestandaardiseerd inkomen (evenveel
# huishoudens per groep, laag naar hoog). Per groep: huishoudens met loon (post 1.1) en hun loon, en huishoudens
# met pensioenpremie werknemer (post 11.4.1.1) en die premie. De kalibratie geeft binnen elke groep dit aandeel
# werknemershuishoudens pensioenpremie, zo hoog dat de premie als deel van het loon klopt met CBS.
pensioenpremie:
  bron: "CBS StatLine 84493NED, Inkomen van huishoudens; inkomensbestanddelen, huishoudenskenmerken, 2024: posten 1.1 en 11.4.1.1, naar gestandaardiseerd inkomen (10%-groepen) en leeftijd hoofdkostwinner (https://opendata.cbs.nl/statline/#/CBS/nl/dataset/84493NED)"
  jaar: 2024
  perDeciel:
    - { huishoudensMetLoon: 378300, loonMln: 3468, huishoudensMetPremie: 44600, premieMln: 35 }
    - { huishoudensMetLoon: 280200, loonMln: 5733, huishoudensMetPremie: 143800, premieMln: 152 }
    - { huishoudensMetLoon: 368800, loonMln: 11103, huishoudensMetPremie: 293100, premieMln: 392 }
    - { huishoudensMetLoon: 482500, loonMln: 18779, huishoudensMetPremie: 419500, premieMln: 785 }
    - { huishoudensMetLoon: 546200, loonMln: 26590, huishoudensMetPremie: 487800, premieMln: 1214 }
    - { huishoudensMetLoon: 595000, loonMln: 35359, huishoudensMetPremie: 541300, premieMln: 1707 }
    - { huishoudensMetLoon: 630100, loonMln: 44810, huishoudensMetPremie: 582700, premieMln: 2277 }
    - { huishoudensMetLoon: 675400, loonMln: 57034, huishoudensMetPremie: 632600, premieMln: 3038 }
    - { huishoudensMetLoon: 704700, loonMln: 72428, huishoudensMetPremie: 665600, premieMln: 4067 }
    - { huishoudensMetLoon: 688100, loonMln: 104335, huishoudensMetPremie: 636800, premieMln: 5496 }
  # Naar leeftijd hoofdkostwinner (25 tot 65 is de som van de vier CBS-groepen daartussen). De kalibratie past de
  # deelname tegelijk aan de 10%-groepen en aan deze leeftijdsgroepen aan.
  perLeeftijd:
    - { totLeeftijd: 25, huishoudensMetLoon: 350700, huishoudensMetPremie: 144300 }
    - { totLeeftijd: 65, huishoudensMetLoon: 4621600, huishoudensMetPremie: 4132800 }
    - { totLeeftijd: null, huishoudensMetLoon: 377000, huishoudensMetPremie: 170500 }

indexatie:
  bron: "CPB, Kerngegevenstabel MEV 2027 (september 2026): cao-loon marktsector 5,3% in 2025 en 4,3% in 2026 (https://www.cpb.nl/system/files/cpbmedia/CPB-kerngegevens-MEV-2027.pdf)"
  # Groei van de inkomens van 2024 naar 2026: 1,053 × 1,043.
  factor: 1.0983

# De top van de inkomensverdeling (D-068): personen in particuliere huishoudens naar persoonlijk bruto inkomen
# (inkomen uit werk en onderneming, uitkeringen en pensioen), 2024. De kalibratie stemt het aantal personen in deze
# klassen en hun totale inkomen af. CBS telt bij het inkomen van werknemers de werkgeverslasten mee (post 1.3 in
# 84494NED: premies WW, WIA, Zvw en pensioen van de werkgever); die telt de kalibratie bij het model op.
topinkomens:
  bron: "CBS StatLine 83931NED, Inkomen van personen; inkomensklassen, persoonskenmerken, 2024, persoonlijk bruto inkomen (https://opendata.cbs.nl/statline/#/CBS/nl/dataset/83931NED)"
  jaar: 2024
  klassen:
    - { vanaf: 100000, tot: 200000, personen: 1219900, gemiddeld: 128500 }
    - { vanaf: 200000, tot: null, personen: 149500, gemiddeld: 311100 }
  werkgeverslasten:
    bron: "Premies 2024 (Aof 7,29 + Whk 1,22 + Wko 0,5 + AWF 3,89 + Zvw 6,57 = 19,47%, tot € 71.624): CPB, Macro Economische Verkenning 2027, bijlage 17 Belasting- en premietarieven (https://www.cpb.nl/raming/raming-september-2026-mev-2027). Pensioenpremie werkgever ÷ werknemer: CBS StatLine 84494NED, 2024, posten 11.4.1.2 en 11.4.1.1 (32.207 ÷ 19.163 mln; https://opendata.cbs.nl/statline/#/CBS/nl/dataset/84494NED). Ter controle: sociale lasten werkgever zonder pensioen (post 1.3 min 11.4.1.2) zijn 60.063 mln, 15,8% van het loon (post 1.1)."
    socialePremies: 19.47
    maximumPremieInkomen: 71624
    pensioenWerkgeverPerWerknemer: 1.6807

