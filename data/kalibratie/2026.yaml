# Kalibratiedoelen 2026
#
# `npm run kalibreer` maakt een synthetische populatie en herweegt die zo dat ze zo goed mogelijk aansluit op
# deze doelen. Het resultaat staat in data/populatie/2026.json, het rapport in docs/kalibratie-2026.md.
#
# Bedragen in euro, tenzij de naam iets anders zegt.

jaar: 2026

