eigenWoning:
  bron: "Maximaal aftrektarief: gelijk aan het tarief van de tweede schijf, zoals in 2025 en 2026 (Belastingplan 2027, memorie van toelichting, tabel 1 en 2 (Kamerstukken II 2026/27, 37 022, nr. 3; https://www.rijksfinancien.nl/sites/default/files/bestanden/belastingplan-2027/wetsvoorstel-belastingplan-2027/Wetsvoorstel-Belastingplan-2027.pdf), met de tweede nota van wijziging van 20 oktober 2026 (37 022, nr. 22; https://www.tweedekamer.nl/downloads/document?id=2026D50329). Voorstel, nog niet aangenomen.) Forfait, villataks en Wet Hillen: TODO: bron nodig, tijdelijk de bedragen van 2026."
  forfait:
    niveau: 100
    # Eigenwoningforfait als percentage van de hele WOZ-waarde, afhankelijk van de WOZ-waarde.
    tabel:
      - { vanaf: 0, percentage: 0 }
      - { vanaf: 12500, percentage: 0.1 }
      - { vanaf: 25000, percentage: 0.2 }
      - { vanaf: 50000, percentage: 0.25 }
      - { vanaf: 75000, percentage: 0.35 }
    # Boven deze WOZ-waarde: het forfait op de grens, plus dit percentage van het deel daarboven.
    villataks: { vanaf: 1350000, percentage: 2.35 }
  # Hoogste tarief waartegen de aftrek eigen woning werkt. 0 = geen hypotheekrenteaftrek.
  aftrekMaxTarief: 38.16
  # Wet Hillen: is het forfait hoger dan de aftrekbare rente, dan is dit percentage van het verschil aftrekbaar.
  hillenAftrek: 71.867

overigeAftrekposten:
