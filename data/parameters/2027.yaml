uitkeringen:
  bron: "AOW-leeftijd: Rijksoverheid, AOW-leeftijd 2025–2031 (https://www.rijksoverheid.nl/onderwerpen/algemene-ouderdomswet-aow/aow-leeftijd). AOW-bedragen: Raming: de bedragen per 1 juli 2026 + 2,05%, de stijging van het referentiemaandloon per 1 januari 2027 (Regeling indexatie wettelijk minimumloon per 1 januari 2027, 29 oktober 2026; https://www.tweedekamer.nl/kamerstukken/detail?id=2026D54072&did=2026D54072). De AOW volgt het netto minimumloon; de SVB publiceert de bedragen in december. De verhoging per 1 juli 2027 is nog niet bekend en zit er niet in."
  aowLeeftijd: 67
  # Bruto AOW per persoon, zoals de SVB ze publiceert. Per jaar = 6 × eerste halfjaar + 6 × tweede halfjaar
  # + 12 × vakantiegeld.
  aow:
    alleenstaand:
      { perMaandEersteHalfjaar: 1696.23, perMaandTweedeHalfjaar: 1696.23, vakantiegeldPerMaand: 106.93 }
    partners:
      { perMaandEersteHalfjaar: 1162.75, perMaandTweedeHalfjaar: 1162.75, vakantiegeldPerMaand: 76.38 }
  # Netto-koppeling: in een scenario houdt deze uitkering haar netto bedrag; de overheid betaalt het verschil
  # bruto bij. AOW en bijstand zijn gekoppeld aan het netto minimumloon; WW en WIA zijn een percentage van het
  # vroegere bruto loon.
  nettoKoppeling: { aow: true, bijstand: true, werknemersverzekering: false }

box3:
  bron: "Raming: banktegoeden, schulden en schuldendrempel zoals in 2026; die percentages worden pas begin 2028 vastgesteld. Heffingsvrij vermogen € 60.098: € 59.357 × 1,01248, de beperkte inflatiecorrectie uit het Belastingplan 2027 (memorie van toelichting, paragraaf 4; https://www.rijksfinancien.nl/sites/default/files/bestanden/belastingplan-2027/wetsvoorstel-belastingplan-2027/Wetsvoorstel-Belastingplan-2027.pdf). De voorgestelde verlaging naar € 30.846 (Kamerbrief van 29 september 2026) gaat niet door (Kamerbrief Aanpassingen Belastingplan en box 3, 3 november 2026; https://www.tweedekamer.nl/kamerstukken/brieven_regering/detail?id=2026Z23851&did=2026D55029). Overige bezittingen 6,37%: Rendement, Forfait box 3 voor beleggingen in 2027 weer hoger (26 januari 2026; https://www.rendement.nl/inkomen-uit-sparen-en-beleggen/nieuws/forfait-box-3-voor-beleggingen-in-2027-weer-hoger.html). Tarief 36%."
  # Heffingsvrij vermogen en schuldendrempel per persoon; fiscale partners hebben samen het dubbele.
  heffingsvrijVermogen: 60098
  schuldendrempel: 3800
  # Forfaitair rendement in procent: banktegoeden, overige bezittingen (beleggingen, tweede woning) en schulden.
  rendement: { banktegoeden: 1.28, overig: 6.37, schulden: 2.7 }
  tarief: 36

basisinkomen:
  bron: "Bestaat niet in de huidige wet (0); alleen voor scenario's. Het basisinkomen is onbelast, voor elke volwassene in het huishouden, en komt in plaats van (een deel van) de bijstand en de AOW."
  perVolwassenePerMaand: 0

bijstand:
  bron: "Raming: de normen per 1 juli 2026 + 2,05%, de stijging van het referentiemaandloon per 1 januari 2027 (Regeling indexatie wettelijk minimumloon per 1 januari 2027, 29 oktober 2026; https://www.tweedekamer.nl/kamerstukken/detail?id=2026D54072&did=2026D54072). De bijstand volgt het netto minimumloon; SZW publiceert de normen half december. De verhoging per 1 juli 2027 is nog niet bekend en zit er niet in."
  # Netto bijstandsnorm per maand inclusief vakantiegeld, 21 jaar tot de AOW-leeftijd. Per jaar = 6 × eerste
  # halfjaar + 6 × tweede halfjaar. De norm voor gehuwden geldt voor het paar samen.
  alleenstaand: { eersteHalfjaar: 1448.56, tweedeHalfjaar: 1448.56 }
  gehuwden: { eersteHalfjaar: 2069.36, tweedeHalfjaar: 2069.36 }
  # Onder deze leeftijd gelden lagere jongerennormen; die zitten niet in het model.
  minimumLeeftijd: 21

ondernemers:
  bron: "Belastingplan 2027, memorie van toelichting, tabel 1 en 2 (Kamerstukken II 2026/27, 37 022, nr. 3; https://www.rijksfinancien.nl/sites/default/files/bestanden/belastingplan-2027/wetsvoorstel-belastingplan-2027/Wetsvoorstel-Belastingplan-2027.pdf), met de tweede nota van wijziging van 20 oktober 2026 (37 022, nr. 22; https://www.tweedekamer.nl/downloads/document?id=2026D50329). Voorstel, nog niet aangenomen. Startersaftrek 2027: € 10 (memorie van toelichting, paragraaf 5.5); in 2028 afgeschaft."
  # Ondernemersaftrek: alleen bij het urencriterium. De startersaftrek komt erbij in de eerste jaren.
  zelfstandigenaftrek: 900
  startersaftrek: 10
  # Vrijstelling over de winst na ondernemersaftrek, ook zonder urencriterium.
  mkbWinstvrijstelling: 12.7
  urencriterium: 1225

zorg:
  bron: "Raming: nominale premie en verlaagde Zvw-bijdrage uit de Rijksbegroting 2027, XVI Volksgezondheid, Welzijn en Sport, tabel 77 Premieoverzicht Zvw (Kamerstukken II 2026/27, 37 020 XVI, nr. 2; https://www.rijksfinancien.nl/memorie-van-toelichting/2027/OWB/XVI); de verzekeraars maken hun premies uiterlijk 12 november 2026 bekend. Maximum bijdrage-inkomen: CPB, Macro Economische Verkenning 2027, bijlage 17 Belasting- en premietarieven (https://www.cpb.nl/raming/raming-september-2026-mev-2027)."
  # Gemiddelde nominale premie per volwassene per jaar.
  nominalePremiePerVolwassene: 2029
  # Inkomensafhankelijke bijdrage Zvw die mensen zelf betalen: AOW'ers over AOW en pensioen, zelfstandigen over hun
  # belastbare winst. Voor werknemers en uitkeringen betaalt de werkgever of uitkeringsinstantie; dat valt buiten
  # het model.
  zvwBijdrage: 5.02
  zvwMaximumInkomen: 82547
  # Vanaf deze leeftijd betaalt iemand zelf de nominale premie en kan diegene zorgtoeslag krijgen (Zvw).
  volwassenVanaf: 18

kinderbijslag:
  bron: "Raming: de bedragen van 2026 × de tabelcorrectiefactor 2027 van 1,026 (Belastingplan 2027, memorie van toelichting, paragraaf 4: zonder de vrijheidsbijdrage 2,6%; de beperking tot 48% geldt alleen voor de inkomstenbelasting; https://www.rijksfinancien.nl/sites/default/files/bestanden/belastingplan-2027/wetsvoorstel-belastingplan-2027/Wetsvoorstel-Belastingplan-2027.pdf). De kinderbijslag stijgt elk half jaar met de consumentenprijsindex (Algemene Kinderbijslagwet; https://wetten.overheid.nl/BWBR0002221); de tabelcorrectiefactor is op dezelfde prijsindex gebaseerd. De SVB publiceert de bedragen in december."
  niveau: 100
  # Bedrag per kind per kwartaal, per leeftijdsgroep. Per jaar = 2 × eerste halfjaar + 2 × tweede halfjaar.
  perKwartaal:
    - { totLeeftijd: 6, eersteHalfjaar: 302.74, tweedeHalfjaar: 306.16 }
    - { totLeeftijd: 12, eersteHalfjaar: 367.62, tweedeHalfjaar: 371.77 }
    - { totLeeftijd: 18, eersteHalfjaar: 432.49, tweedeHalfjaar: 437.37 }

loon:
  bron: "Vakantiegeld: Wet minimumloon en minimumvakantiebijslag, artikel 15: vakantiebijslag minimaal 8% (https://wetten.overheid.nl/BWBR0002638). Modaal: CPB, Macro Economische Verkenning 2027, kerngegevens (bruto modaal inkomen 2027: € 50.000, raming; https://www.cpb.nl/raming/raming-september-2026-mev-2027)."
  # Wettelijk minimum vakantiegeld als percentage van het loon; gebruikt om een maandloon zonder vakantiegeld
  # om te rekenen naar een jaarinkomen.
  vakantiegeld: 8
  # Bruto modaal inkomen per jaar, inclusief vakantiegeld: het voorbeeldhuishouden op de site verdient dit. Telt niet
  # mee in de berekening.
  modaal: 50000

pensioenpremie:
  bron: "TODO: bron nodig. De premiepercentages van ABP (nieuw pensioenstelsel per 2027) voor 2027 zijn nog niet gepubliceerd; tijdelijk de bedragen van 2026."
  # Standaard als iemand in loondienst niet weet wat er op de loonstrook staat: de regeling van ABP, het grootste
