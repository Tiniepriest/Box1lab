# Parameters belastingjaar 2026
#
# Afspraken (zie ook docs/JAARLIJKSE-UPDATE.md):
# - Percentages schrijf je als percentage: 35,75% wordt 35.75.
# - Bedragen in euro per jaar, tenzij de naam iets anders zegt (bijvoorbeeld "perMaand").
# - Een punt is de decimaal: € 1.575,50 schrijf je als 1575.50.
# - Elke sectie heeft een "bron". Weet je de bron niet? Schrijf "TODO: bron nodig".
# - "niveau" is een knop voor scenario's: 100 = zoals de wet nu is, 0 = afgeschaft.
#
# Status: fase 2. Alle bedragen zijn gecontroleerd tegen officiële bronnen (zie "bron" per sectie).

jaar: 2027
# Voorlopig: zie de toelichting. Zet op "definitief" als alle bedragen officieel zijn en geen TODO meer hebben.
status: voorlopig
toelichting: "Gebaseerd op het Belastingplan 2027 zoals ingediend op 15 september 2026, met de tweede nota van wijziging van 20 oktober 2026. Het voorstel is nog niet aangenomen door de Tweede en Eerste Kamer. Bedragen die nog niet bekend zijn, staan op het niveau van 2026."

box1:
  bron: "Belastingplan 2027, memorie van toelichting, tabel 1 en 2 (Kamerstukken II 2026/27, 37 022, nr. 3; https://www.rijksfinancien.nl/sites/default/files/bestanden/belastingplan-2027/wetsvoorstel-belastingplan-2027/Wetsvoorstel-Belastingplan-2027.pdf), met de tweede nota van wijziging van 20 oktober 2026 (37 022, nr. 22; https://www.tweedekamer.nl/downloads/document?id=2026D50329). Voorstel, nog niet aangenomen."
  # Belastingvrij deel per persoon. Bestaat nu niet (0); handig voor scenario's als een vlaktaks.
  vrijstelling: 0
  # Inkomstenbelasting plus premies volksverzekeringen. De laatste schijf heeft "tot: null" (geen bovengrens).
  schijven:
    - { tot: 39247, tarief: 36.23 }
    # Aanvangspunt toptarief volgens de tweede nota van wijziging (was € 78.426 in het voorstel).
    - { tot: 80578, tarief: 38.16 }
    - { tot: null, tarief: 49.5 }
  # AOW'ers betalen geen AOW-premie: hun tarief in de eerste schijf is zoveel procentpunt lager
  # (36,23% − 18,33% voor AOW'ers geboren in of na 1946 = 17,90).
  aowVerlagingEersteSchijf: 17.9

# Een heffingskorting is een "staffel": een reeks stukken die elk beginnen bij een inkomen ("vanaf").
# Op elk stuk is de korting: bedrag + tarief% × (inkomen − vanaf). Een negatief tarief is afbouw.
# De korting is nooit lager dan 0 en nooit hoger dan "maximum" (als dat er staat).
# "staffelAow" geldt voor wie het hele jaar de AOW-leeftijd heeft.
heffingskortingen:
  algemeen:
    bron: "Belastingplan 2027, memorie van toelichting, tabel 1 en 2 (Kamerstukken II 2026/27, 37 022, nr. 3; https://www.rijksfinancien.nl/sites/default/files/bestanden/belastingplan-2027/wetsvoorstel-belastingplan-2027/Wetsvoorstel-Belastingplan-2027.pdf), met de tweede nota van wijziging van 20 oktober 2026 (37 022, nr. 22; https://www.tweedekamer.nl/downloads/document?id=2026D50329). Voorstel, nog niet aangenomen. Het afbouwpercentage is afgeleid: de korting is nul bij het aanvangspunt van het toptarief, zoals in eerdere jaren. Het afbouwpunt hangt af van het minimumloon (november 2026)."
    niveau: 100
    staffel:
      - { vanaf: 0, bedrag: 3154, tarief: 0 }
      # 3.154 / (80.578 − 30.910) = 6,350%
      - { vanaf: 30910, bedrag: 3154, tarief: -6.35 }
    staffelAow:
      - { vanaf: 0, bedrag: 1596, tarief: 0 }
      # 1.596 / (80.578 − 30.910) = 3,213%
      - { vanaf: 30910, bedrag: 1596, tarief: -3.213 }
  arbeid:
