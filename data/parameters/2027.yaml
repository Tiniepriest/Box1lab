eigenWoning:
  bron: "Maximaal aftrektarief: gelijk aan het tarief van de tweede schijf, zoals in 2025 en 2026 (Belastingplan 2027, memorie van toelichting, tabel 1 en 2 (Kamerstukken II 2026/27, 37 022, nr. 3; https://www.rijksfinancien.nl/sites/default/files/bestanden/belastingplan-2027/wetsvoorstel-belastingplan-2027/Wetsvoorstel-Belastingplan-2027.pdf), met de tweede nota van wijziging van 20 oktober 2026 (37 022, nr. 22; https://www.tweedekamer.nl/downloads/document?id=2026D50329). Voorstel, nog niet aangenomen.) Forfait, villataks en Wet Hillen: TODO: bron nodig, tijdelijk de bedragen van 2026."
  forfait:
    niveau: 100
    # Eigenwoningforfait als percentage van de hele WOZ-waarde, afhankelijk van de WOZ-waarde.
    tabel:
      - { vanaf: 0, percentage: 0 }
      - { vanaf: 12500, percentage: 0.1 }
      - { vanaf: 25000, percentage: 0.2 }
      - { vanaf: 50000, percentage: 0.25 }
      - { vanaf: 75000, percentage: 0.35 }
    # Boven deze WOZ-waarde: het forfait op de grens, plus dit percentage van het deel daarboven.
    villataks: { vanaf: 1350000, percentage: 2.35 }
  # Hoogste tarief waartegen de aftrek eigen woning werkt. 0 = geen hypotheekrenteaftrek.
  aftrekMaxTarief: 38.16
  # Wet Hillen: is het forfait hoger dan de aftrekbare rente, dan is dit percentage van het verschil aftrekbaar.
  hillenAftrek: 71.867

overigeAftrekposten:
  bron: "Miljoenennota 2027, bijlage Fiscale regelingen, tabel 4.3.2 'Overzicht budgettair belang per fiscale regeling', kolom 2027 (Kamerstukken II 2026/27, 37 020, nr. 2, 15 september 2026; https://www.tweedekamer.nl/downloads/document?id=2026D38820)."
  # Aftrekposten in box 1 die het model niet per huishouden berekent: hun budgettair belang in miljard euro per
  # jaar. De knop 'niveau' schaalt ze samen (100 = huidig, 0 = afgeschaft).
  posten:
    # Categorietotaal: giften, specifieke zorgkosten, alimentatie en dergelijke.
    persoonsgebondenAftrek: 0.811
    lijfrentePremieaftrek: 1.424
    arbeidsongeschiktheidsverzekeringPremieaftrek: 0.652
    # De zelfstandigenaftrek en de mkb-winstvrijstelling rekent het model per huishouden (sectie ondernemers).
    # De modelbevolking heeft geen starters en geen meewerkende partners; die aftrek staat daarom hier.
    startersaftrek: 0.003
    meewerkaftrek: 0.002
  niveau: 100

toeslagen:
  zorgtoeslag:
    bron: "Raming: de standaardpremie is de raming uit de Rijksbegroting 2027, XVI Volksgezondheid, Welzijn en Sport, tabel 77 Premieoverzicht Zvw (Kamerstukken II 2026/27, 37 020 XVI, nr. 2; https://www.rijksfinancien.nl/memorie-van-toelichting/2027/OWB/XVI); de NZa stelt hem in november 2026 vast. Percentages: Wet op de zorgtoeslag, artikel 2, derde lid, tekst per 1 januari 2027 (https://wetten.overheid.nl/BWBR0018451/2027-01-01). Drempelinkomen: 108% van 12 × het referentiemaandloon van € 2.385,00 per 1 januari 2027 (Regeling indexatie wettelijk minimumloon per 1 januari 2027, 29 oktober 2026; https://www.tweedekamer.nl/kamerstukken/detail?id=2026D54072&did=2026D54072), gelijk aan het afbouwpunt in het Belastingplan 2027. Maximaal toetsingsinkomen: afgeleid, het inkomen waarboven de zorgtoeslag lager is dan € 24 per jaar (Awir, artikel 14, vijfde lid), zoals in 2026. Vermogensgrens: Wet op de zorgtoeslag, artikel 3, tekst per 1 januari 2027 (€ 116.103 en € 154.725, na de verlaging met € 30.686 uit de VWS-begroting; https://wetten.overheid.nl/BWBR0018451/2027-01-01) × de tabelcorrectiefactor 2027 van 1,026 (Belastingplan 2027, memorie van toelichting, paragraaf 4: zonder de vrijheidsbijdrage 2,6%; de beperking tot 48% geldt alleen voor de inkomstenbelasting; https://www.rijksfinancien.nl/sites/default/files/bestanden/belastingplan-2027/wetsvoorstel-belastingplan-2027/Wetsvoorstel-Belastingplan-2027.pdf)."
    niveau: 100
    # Per volwassene; voor partners geldt twee keer de standaardpremie.
    standaardpremie: 2277
    drempelinkomen: 30910
    # Normpremie = percentage van het drempelinkomen + afbouwpercentage × (toetsingsinkomen − drempelinkomen).
    normpremieDrempel: { alleenstaand: 1.930, partners: 4.307 }
    normpremieAfbouw: 13.76
    # 30.910 + (2.277 − 1,930% × 30.910 − 24) / 13,76% en 30.910 + (2 × 2.277 − 4,307% × 30.910 − 24) / 13,76%.
    maxToetsingsinkomen: { alleenstaand: 42948, partners: 54156 }
    maxVermogen: { alleenstaand: 119122, partners: 158748 }
  huurtoeslag:
    bron: "Raming: alle bedragen van 2026 × de tabelcorrectiefactor 2027 van 1,026 (Belastingplan 2027, memorie van toelichting, paragraaf 4: zonder de vrijheidsbijdrage 2,6%; de beperking tot 48% geldt alleen voor de inkomstenbelasting; https://www.rijksfinancien.nl/sites/default/files/bestanden/belastingplan-2027/wetsvoorstel-belastingplan-2027/Wetsvoorstel-Belastingplan-2027.pdf). Voor de huurgrens en de inkomens schrijft de Wet op de huurtoeslag (artikel 27, eerste lid) die factor voor; de andere grenzen en de basishuur stijgen met de huurprijsontwikkeling (artikel 27, derde lid; https://wetten.overheid.nl/BWBR0008659), die nog niet bekend is. Inkomens naar boven afgerond op € 25 (artikel 27, vijfde lid). De officiële bedragen komen eind november 2026 in de Staatscourant."
    niveau: 100
    # Bedragen in deze sectie zijn per maand, behalve inkomens en vermogen.
    huurgrens: 957.19
    basishuur: { eenpersoons: 207.79, meerpersoons: 205.93 }
    kwaliteitskortingsgrens: 511.15
    aftoppingsgrens: { eenOfTweePersonen: 731.56, drieOfMeerPersonen: 784.01 }
    # Vergoeding van de huur tot de kwaliteitskortingsgrens, tot de aftoppingsgrens en tot de huurgrens.
    vergoeding: { totKwaliteitskortingsgrens: 100, totAftoppingsgrens: 65, totHuurgrens: 40 }
    # Inkomensafhankelijke correctie: afbouw% × (rekeninkomen − inkomensijkpunt), per jaar.
    inkomensijkpunt: { eenpersoons: 24050, meerpersoons: 32325 }
    afbouw: { eenpersoons: 27, meerpersoons: 22 }
    # Van inwonende kinderen jonger dan 23 telt alleen het inkomen boven dit bedrag mee in het rekeninkomen.
    inkomensvrijstellingKind: 6380
    maxVermogen: { alleenstaand: 39479, partners: 78959 }
  kindgebondenBudget:
    bron: "Raming: de bedragen van 2026 × de tabelcorrectiefactor 2027 van 1,026 (Belastingplan 2027, memorie van toelichting, paragraaf 4: zonder de vrijheidsbijdrage 2,6%; de beperking tot 48% geldt alleen voor de inkomstenbelasting; https://www.rijksfinancien.nl/sites/default/files/bestanden/belastingplan-2027/wetsvoorstel-belastingplan-2027/Wetsvoorstel-Belastingplan-2027.pdf), zoals de Wet op het kindgebonden budget voorschrijft (artikel 3, eerste lid), en daarna € 66 extra per kind (artikel 3, zevende en achtste lid). Afbouwpercentage: artikel 3, vijfde lid, tekst per 1 januari 2027 (https://wetten.overheid.nl/BWBR0022751/2027-01-01). Drempelinkomen: 108% van 12 × het referentiemaandloon van € 2.385,00 per 1 januari 2027 (Regeling indexatie wettelijk minimumloon per 1 januari 2027, 29 oktober 2026; https://www.tweedekamer.nl/kamerstukken/detail?id=2026D54072&did=2026D54072), gelijk aan het afbouwpunt in het Belastingplan 2027. Voor partners komt daar € 9.405 × 1,026 = € 9.650 bij (artikel 2, achtste lid). Vermogensgrens: gelijk aan die van de zorgtoeslag (VWS-begroting 2027, artikel 8). De officiële bedragen volgen eind 2026. Het wetsvoorstel voor een snellere afbouw bij hogere inkomens (Kamerstukken 36 923) is aangehouden en zit hier niet in."
