gedrag:
  bron: "Modelkeuze. 0 = geen gedragseffect (statische doorrekening)."
  # Elasticiteit van het belastbaar inkomen voor werkenden.
  eti: 0

methodiek:
  bron: "Modelkeuze, zoals in het prototype."
  # Equivalentieschaal (OECD-gemodificeerd): eerste volwassene telt als 1, elke volgende persoon vanaf
  # "kindVanafLeeftijd" als extraVolwassene, jongere kinderen als kind.
  equivalentie: { extraVolwassene: 0.5, kind: 0.3, kindVanafLeeftijd: 14 }
  # Armoederisicogrens als percentage van het mediane gestandaardiseerde besteedbaar inkomen.
  armoedegrens: 60
  # Grenzen (in procent verandering van het besteedbaar inkomen) voor de vijf klassen winnaars en verliezers:
