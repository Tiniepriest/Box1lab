# Parameters belastingjaar 2027
#
# Afspraken (zie ook docs/JAARLIJKSE-UPDATE.md):
# - Percentages schrijf je als percentage: 35,75% wordt 35.75.
# - Bedragen in euro per jaar, tenzij de naam iets anders zegt (bijvoorbeeld "perMaand").
# - Een punt is de decimaal: € 1.575,50 schrijf je als 1575.50.
# - Elke sectie heeft een "bron". Weet je de bron niet? Schrijf "TODO: bron nodig".
# - Een raming (nog niet officieel, wel afgeleid met de wettelijke indexatie) begint de bron met "Raming:". Vervang
#   die zodra de officiële bedragen er zijn (zie docs/JAARLIJKSE-UPDATE.md).
# - "niveau" is een knop voor scenario's: 100 = zoals de wet nu is, 0 = afgeschaft.
#
jaar: 2027
# Voorlopig: zie de toelichting. Zet op "definitief" als alle bedragen officieel zijn en geen TODO meer hebben.
status: voorlopig
toelichting: "Gebaseerd op het Belastingplan 2027 zoals de Tweede Kamer het op 12 november 2026 aannam: met de vier nota's van wijziging en de amendementen van ChristenUnie en 50PLUS (nr. 42) en van PRO en Volt (nr. 80). De Eerste Kamer moet nog stemmen. Bedragen die nog niet officieel zijn, zijn geraamd met de gewone jaarlijkse verhoging; de officiële bedragen volgen in november en december 2026. Wat nog helemaal niet bekend is, staat op het niveau van 2026."

box1:
  bron: "Tarieftabel: vierde nota van wijziging (37 022, nr. 51; https://www.tweedekamer.nl/downloads/document?id=2026D56605), met het amendement Grinwis c.s. (37 022, nr. 42; https://www.tweedekamer.nl/downloads/document?id=2026D56417) (eerste en tweede schijf −0,14 procentpunt) en het amendement Klaver en Dassen (37 022, nr. 80; https://www.tweedekamer.nl/downloads/document?id=2026D57504) (eerste schijf −0,25 procentpunt). Het tarief van de eerste schijf is 8,19% inkomstenbelasting plus 27,65% premies volksverzekeringen, waarvan 17,90% AOW-premie (memorie van toelichting, tabel 1 en 2; Kamerstukken II 2026/27, 37 022, nr. 3; https://www.rijksfinancien.nl/sites/default/files/bestanden/belastingplan-2027/wetsvoorstel-belastingplan-2027/Wetsvoorstel-Belastingplan-2027.pdf). Aangenomen door de Tweede Kamer op 12 november 2026 (Handelingen II 2026/27, nr. 24; https://www.tweedekamer.nl/kamerstukken/plenaire_verslagen/detail/2026-2027/24); de Eerste Kamer moet nog stemmen."
  # Belastingvrij deel per persoon. Bestaat nu niet (0); handig voor scenario's als een vlaktaks.
  vrijstelling: 0
  # Inkomstenbelasting plus premies volksverzekeringen. De laatste schijf heeft "tot: null" (geen bovengrens).
  schijven:
    - { tot: 39337, tarief: 35.84 }
    # Aanvangspunt toptarief volgens de vierde nota van wijziging (was € 78.426 in het voorstel).
    - { tot: 80819, tarief: 38.02 }
    - { tot: null, tarief: 49.5 }
  # AOW'ers betalen geen AOW-premie: hun tarief in de eerste schijf is zoveel procentpunt lager
  # (35,84% − 17,94% voor AOW'ers geboren in of na 1946 = 17,90).
  # Negatieve belasting bestaat nu niet (false); voor scenario's als een negatieve inkomstenbelasting. Aan: wie
  # minder verdient dan de vrijstelling, of meer korting heeft dan belasting, krijgt het verschil uitbetaald.
  negatieveBelasting: false
  aowVerlagingEersteSchijf: 17.9
  # Premies volksverzekeringen in het tarief van de eerste schijf (AOW 17,90% + Anw 0,10% + Wlz 9,65%); de rest
  # is inkomstenbelasting. Een heffingskorting is in dezelfde verhouding belastingdeel en premiedeel; alleen het
  # belastingdeel kan ook van de belasting in box 3 af.
  premieVolksverzekeringen: 27.65

# Een heffingskorting is een "staffel": een reeks stukken die elk beginnen bij een inkomen ("vanaf").
# Op elk stuk is de korting: bedrag + tarief% × (inkomen − vanaf). Een negatief tarief is afbouw.
# De korting is nooit lager dan 0 en nooit hoger dan "maximum" (als dat er staat).
# "staffelAow" geldt voor wie het hele jaar de AOW-leeftijd heeft.
heffingskortingen:
  algemeen:
    bron: "Raming: de bedragen van 2026 × de inflatiecorrectie 1,015548 in plaats van 1,01248 (derde nota van wijziging (37 022, nr. 29; https://www.tweedekamer.nl/downloads/document?id=2026D55208), onderdelen 4 tot en met 6), naar boven afgerond op hele euro's zoals in tabel 1 en 2 van de memorie van toelichting (Kamerstukken II 2026/27, 37 022, nr. 3; https://www.rijksfinancien.nl/sites/default/files/bestanden/belastingplan-2027/wetsvoorstel-belastingplan-2027/Wetsvoorstel-Belastingplan-2027.pdf). Aangenomen door de Tweede Kamer op 12 november 2026 (Handelingen II 2026/27, nr. 24; https://www.tweedekamer.nl/kamerstukken/plenaire_verslagen/detail/2026-2027/24); de Eerste Kamer moet nog stemmen. De officiële bedragen volgen in december. Voor AOW'ers: het maximum × 17,94 / 35,84, het deel zonder AOW-premie. Het afbouwpercentage is afgeleid: de korting is nul bij het aanvangspunt van het toptarief, zoals in eerdere jaren. Het afbouwpunt is 108% van het minimumloon (Regeling indexatie wettelijk minimumloon per 1 januari 2027; https://www.tweedekamer.nl/kamerstukken/detail?id=2026D54072&did=2026D54072)."
    niveau: 100
    staffel:
      - { vanaf: 0, bedrag: 3164, tarief: 0 }
      # 3.164 / (80.819 − 30.910) = 6,340%
      - { vanaf: 30910, bedrag: 3164, tarief: -6.34 }
    staffelAow:
      - { vanaf: 0, bedrag: 1584, tarief: 0 }
      # 1.584 / (80.819 − 30.910) = 3,174%
      - { vanaf: 30910, bedrag: 1584, tarief: -3.174 }
  arbeid:
    bron: "Raming: de drie bedragen zijn die van 2026 × 1,015548 plus € 17, naar boven afgerond (Belastingplan 2027, artikel I, onderdeel J, en artikel L; € 133 in het wetsvoorstel, € 116 lager door het amendement Grinwis c.s. (37 022, nr. 42; https://www.tweedekamer.nl/downloads/document?id=2026D56417); inflatiecorrectie 1,015548 in plaats van 1,01248 (derde nota van wijziging (37 022, nr. 29; https://www.tweedekamer.nl/downloads/document?id=2026D55208), onderdelen 4 tot en met 6)). De inkomensgrenzen van de eerste twee knikken zijn die van 2026 × 1,015548 en de percentages zijn daaruit afgeleid. Het afbouwpunt is gekoppeld aan het minimumloon (memorie van toelichting, tabel 1; Kamerstukken II 2026/27, 37 022, nr. 3; https://www.rijksfinancien.nl/sites/default/files/bestanden/belastingplan-2027/wetsvoorstel-belastingplan-2027/Wetsvoorstel-Belastingplan-2027.pdf). Aangenomen door de Tweede Kamer op 12 november 2026 (Handelingen II 2026/27, nr. 24; https://www.tweedekamer.nl/kamerstukken/plenaire_verslagen/detail/2026-2027/24); de Eerste Kamer moet nog stemmen. Bedragen voor AOW'ers: TODO: bron nodig, tijdelijk die van 2026."
    niveau: 100
    staffel:
      # 1.029 / 12.151 = 8,468%; (5.400 − 1.029) / (26.247 − 12.151) = 31,009%; (5.791 − 5.400) / (47.834 − 26.247) = 1,811%
      - { vanaf: 0, bedrag: 0, tarief: 8.468 }
      - { vanaf: 12151, bedrag: 1029, tarief: 31.009 }
      - { vanaf: 26247, bedrag: 5400, tarief: 1.811 }
      - { vanaf: 47834, bedrag: 5791, tarief: -6.51 }
    staffelAow:
      - { vanaf: 0, bedrag: 0, tarief: 4.156 }
      - { vanaf: 11965, bedrag: 498, tarief: 15.483 }
      - { vanaf: 25845, bedrag: 2647, tarief: 0.974 }
      - { vanaf: 45592, bedrag: 2840, tarief: -3.25 }
  ouderen:
    bron: "Raming: de bedragen van 2026 × de inflatiecorrectie 1,015548 in plaats van 1,01248 (derde nota van wijziging (37 022, nr. 29; https://www.tweedekamer.nl/downloads/document?id=2026D55208), onderdelen 4 tot en met 6), naar boven afgerond op hele euro's zoals in tabel 1 en 2 van de memorie van toelichting (Kamerstukken II 2026/27, 37 022, nr. 3; https://www.rijksfinancien.nl/sites/default/files/bestanden/belastingplan-2027/wetsvoorstel-belastingplan-2027/Wetsvoorstel-Belastingplan-2027.pdf). Aangenomen door de Tweede Kamer op 12 november 2026 (Handelingen II 2026/27, nr. 24; https://www.tweedekamer.nl/kamerstukken/plenaire_verslagen/detail/2026-2027/24); de Eerste Kamer moet nog stemmen. De officiële bedragen volgen in december. De verlaging met € 100 uit het wetsvoorstel (artikel I, onderdeel K) gaat niet door: amendement Grinwis c.s. (37 022, nr. 42; https://www.tweedekamer.nl/downloads/document?id=2026D56417)."
    niveau: 100
    staffel:
      - { vanaf: 0, bedrag: 2100, tarief: 0 }
      - { vanaf: 46718, bedrag: 2100, tarief: -15 }
  alleenstaandeOuderen:
    bron: "Raming: de bedragen van 2026 × de inflatiecorrectie 1,015548 in plaats van 1,01248 (derde nota van wijziging (37 022, nr. 29; https://www.tweedekamer.nl/downloads/document?id=2026D55208), onderdelen 4 tot en met 6), naar boven afgerond op hele euro's zoals in tabel 1 en 2 van de memorie van toelichting (Kamerstukken II 2026/27, 37 022, nr. 3; https://www.rijksfinancien.nl/sites/default/files/bestanden/belastingplan-2027/wetsvoorstel-belastingplan-2027/Wetsvoorstel-Belastingplan-2027.pdf). Aangenomen door de Tweede Kamer op 12 november 2026 (Handelingen II 2026/27, nr. 24; https://www.tweedekamer.nl/kamerstukken/plenaire_verslagen/detail/2026-2027/24); de Eerste Kamer moet nog stemmen. De officiële bedragen volgen in december."
