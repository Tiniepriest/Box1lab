uitkeringen:
  bron: "SVB, AOW-bedragen (https://www.svb.nl/nl/aow/bedragen-aow/aow-bedragen): bedragen vanaf 1 juli 2026 en vakantiegeld. Bedragen 1 januari 2026: ANBO-PCOB (https://anbo-pcob.nl/nieuws/nieuwsberichten/aow-uitkering-stijgt-opnieuw-per-1-januari-2026/)."
  # Bruto AOW per persoon, zoals de SVB ze publiceert. Per jaar = 6 × eerste halfjaar + 6 × tweede halfjaar
  # + 12 × vakantiegeld.
  aow:
    alleenstaand:
      { perMaandEersteHalfjaar: 1637.57, perMaandTweedeHalfjaar: 1662.16, vakantiegeldPerMaand: 104.78 }
    partners:
      { perMaandEersteHalfjaar: 1122.12, perMaandTweedeHalfjaar: 1139.39, vakantiegeldPerMaand: 74.85 }
  # Netto-koppeling: in een scenario houdt deze uitkering haar netto bedrag; de overheid betaalt het verschil
  # bruto bij. AOW en bijstand zijn gekoppeld aan het netto minimumloon; WW en WIA zijn een percentage van het
  # vroegere bruto loon.
  nettoKoppeling: { aow: true, bijstand: true, werknemersverzekering: false }

zorg:
  bron: "Nominale premie: Rijksoverheid, Wat kost een zorgverzekering? (https://www.rijksoverheid.nl/vraag-en-antwoord/zorgverzekering/premie-zorgverzekering). Zvw-bijdrage: Belastingdienst, Tarieven loonheffingen 2026, tabel 11 en 12 (https://download.belastingdienst.nl/belastingdienst/docs/bijlage-nieuwsbrief-loonheffingen-2026-lh2091b63fd.pdf)."
  # Gemiddelde nominale premie per volwassene per jaar.
  nominalePremiePerVolwassene: 1884
  # Inkomensafhankelijke bijdrage Zvw die mensen zelf betalen (zoals AOW'ers over AOW en pensioen).
  # Voor werknemers en uitkeringen betaalt de werkgever of uitkeringsinstantie; dat valt buiten het model.
  zvwBijdrage: 4.85
  zvwMaximumInkomen: 79409

kinderbijslag:
  bron: "SVB, Bedragen kinderbijslag 2026 (https://www.svb.nl/nl/kinderbijslag/bedragen-betaaldagen/bedragen-kinderbijslag)"
  niveau: 100
  # Bedrag per kind per kwartaal, per leeftijdsgroep. Per jaar = 2 × eerste halfjaar + 2 × tweede halfjaar.
  perKwartaal:
    - { totLeeftijd: 6, eersteHalfjaar: 295.07, tweedeHalfjaar: 298.4 }
    - { totLeeftijd: 12, eersteHalfjaar: 358.3, tweedeHalfjaar: 362.35 }
    - { totLeeftijd: 18, eersteHalfjaar: 421.53, tweedeHalfjaar: 426.29 }

gedrag:
  bron: "Modelkeuze. 0 = geen gedragseffect (statische doorrekening)."
  # Elasticiteit van het belastbaar inkomen voor werkenden.
  eti: 0

methodiek:
  bron: "Modelkeuze, zoals in het prototype."
  # Equivalentieschaal: eerste volwassene telt als 1, elke volgende volwassene en elk kind zoveel extra.
  equivalentie: { extraVolwassene: 0.5, kind: 0.3 }
  # Armoederisicogrens als percentage van het mediane gestandaardiseerde besteedbaar inkomen.
  armoedegrens: 60
  # Grenzen (in procent verandering van het besteedbaar inkomen) voor de vijf klassen winnaars en verliezers:
  # verlies > 5%, verlies 1–5%, minder dan 1%, winst 1–5%, winst > 5%.
  winnaarsGrenzen: [-5, -1, 1, 5]
