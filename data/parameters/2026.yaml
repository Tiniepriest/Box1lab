    niveau: 100
    # Per volwassene; voor partners geldt twee keer de standaardpremie.
    standaardpremie: 2119
    drempelinkomen: 29736
    # Normpremie = percentage van het drempelinkomen + afbouwpercentage × (toetsingsinkomen − drempelinkomen).
    normpremieDrempel: { alleenstaand: 1.912, partners: 4.289 }
    normpremieAfbouw: 13.73
    maxToetsingsinkomen: { alleenstaand: 40857, partners: 51142 }
    maxVermogen: { alleenstaand: 146011, partners: 184633 }
  huurtoeslag:
    bron: "Dienst Toeslagen, Berekening huurtoeslag 2026 (https://download.belastingdienst.nl/toeslagen/docs/berekening_huurtoeslag_tg0831z62fd.pdf); Handboek Toeslagen §1.12.1 (https://handboek.toeslagen.nl/htsn/20-huurtoeslag-huurtoeslag/)"
    niveau: 100
    # Bedragen in deze sectie zijn per maand, behalve inkomens en vermogen.
    huurgrens: 932.93
    basishuur: { eenpersoons: 202.52, meerpersoons: 200.71 }
    kwaliteitskortingsgrens: 498.2
    aftoppingsgrens: { eenOfTweePersonen: 713.02, drieOfMeerPersonen: 764.14 }
    # Vergoeding van de huur tot de kwaliteitskortingsgrens, tot de aftoppingsgrens en tot de huurgrens.
