# Parameters belastingjaar 2026
#
# Afspraken (zie ook docs/JAARLIJKSE-UPDATE.md):
# - Percentages schrijf je als percentage: 35,75% wordt 35.75.
# - Bedragen in euro per jaar, tenzij de naam iets anders zegt (bijvoorbeeld "perMaand").
# - Een punt is de decimaal: € 1.575,50 schrijf je als 1575.50.
# - Elke sectie heeft een "bron". Weet je de bron niet? Schrijf "TODO: bron nodig".
# - "niveau" is een knop voor scenario's: 100 = zoals de wet nu is, 0 = afgeschaft.
#
# Status: fase 2. Alle bedragen zijn gecontroleerd tegen officiële bronnen (zie "bron" per sectie).

jaar: 2026

box1:
  bron: "Belastingdienst, Voorlopige aanslag 2026: gebruikte tarieven en heffingskortingen (https://www.belastingdienst.nl/wps/wcm/connect/nl/voorlopige-aanslag/content/voorlopige-aanslag-tarieven-en-heffingskortingen)"
  # Belastingvrij deel per persoon. Bestaat nu niet (0); handig voor scenario's als een vlaktaks.
  vrijstelling: 0
  # Inkomstenbelasting plus premies volksverzekeringen. De laatste schijf heeft "tot: null" (geen bovengrens).
  schijven:
    - { tot: 38883, tarief: 35.75 }
    - { tot: 78426, tarief: 37.56 }
    - { tot: null, tarief: 49.5 }
  # AOW'ers betalen geen AOW-premie: hun tarief in de eerste schijf is zoveel procentpunt lager
  # (35,75% − 17,85% voor AOW'ers geboren in of na 1946 = 17,90).
  aowVerlagingEersteSchijf: 17.9

# Een heffingskorting is een "staffel": een reeks stukken die elk beginnen bij een inkomen ("vanaf").
# Op elk stuk is de korting: bedrag + tarief% × (inkomen − vanaf). Een negatief tarief is afbouw.
# De korting is nooit lager dan 0 en nooit hoger dan "maximum" (als dat er staat).
# "staffelAow" geldt voor wie het hele jaar de AOW-leeftijd heeft.
heffingskortingen:
  algemeen:
    bron: "Belastingdienst, Tabel algemene heffingskorting 2026 (https://www.belastingdienst.nl/wps/wcm/connect/bldcontentnl/belastingdienst/prive/inkomstenbelasting/heffingskortingen_boxen_tarieven/heffingskortingen/algemene_heffingskorting/tabel-algemene-heffingskorting-2026)"
    niveau: 100
    staffel:
      - { vanaf: 0, bedrag: 3115, tarief: 0 }
      - { vanaf: 29736, bedrag: 3115, tarief: -6.398 }
    staffelAow:
      - { vanaf: 0, bedrag: 1556, tarief: 0 }
      - { vanaf: 29736, bedrag: 1556, tarief: -3.195 }
  arbeid:
    bron: "Belastingdienst, Tabel arbeidskorting 2026 (https://www.belastingdienst.nl/wps/wcm/connect/bldcontentnl/belastingdienst/prive/inkomstenbelasting/heffingskortingen_boxen_tarieven/heffingskortingen/arbeidskorting/tabel-arbeidskorting-2026)"
    niveau: 100
    staffel:
      - { vanaf: 0, bedrag: 0, tarief: 8.324 }
      - { vanaf: 11965, bedrag: 996, tarief: 31.009 }
      - { vanaf: 25845, bedrag: 5300, tarief: 1.95 }
      - { vanaf: 45592, bedrag: 5685, tarief: -6.51 }
    staffelAow:
      - { vanaf: 0, bedrag: 0, tarief: 4.156 }
      - { vanaf: 11965, bedrag: 498, tarief: 15.483 }
      - { vanaf: 25845, bedrag: 2647, tarief: 0.974 }
      - { vanaf: 45592, bedrag: 2840, tarief: -3.25 }
  ouderen:
    bron: "Belastingdienst, Fiscale Informatie 2026, hoofdstuk 21 Heffingskortingen (https://www.belastingdienst.nl/wps/wcm/connect/fisin/fisin2026/heffingskortingen)"
    niveau: 100
    staffel:
      - { vanaf: 0, bedrag: 2067, tarief: 0 }
      - { vanaf: 46002, bedrag: 2067, tarief: -15 }
  alleenstaandeOuderen:
    bron: "Belastingdienst, Fiscale Informatie 2026, hoofdstuk 21 Heffingskortingen (https://www.belastingdienst.nl/wps/wcm/connect/fisin/fisin2026/heffingskortingen)"
    niveau: 100
    # Voor AOW'ers zonder partner.
    bedrag: 540
  combinatie:
    bron: "Belastingdienst, Fiscale Informatie 2026, hoofdstuk 21 Heffingskortingen (https://www.belastingdienst.nl/wps/wcm/connect/fisin/fisin2026/heffingskortingen)"
    niveau: 100
    staffel:
      - { vanaf: 0, bedrag: 0, tarief: 0 }
      - { vanaf: 6239, bedrag: 0, tarief: 11.45 }
    maximum: 3032
    staffelAow:
      - { vanaf: 0, bedrag: 0, tarief: 0 }
      - { vanaf: 6239, bedrag: 0, tarief: 5.72 }
    maximumAow: 1514

eigenWoning:
  bron: "Belastingdienst, Fiscale Informatie 2026, hoofdstuk 10 Eigen woning (https://www.belastingdienst.nl/wps/wcm/connect/fisin/fisin2026/eigen_woning_en_restschuld_vroegere); maximaal aftrektarief: antwoord Kamervragen 23 juni 2026 (https://zoek.officielebekendmakingen.nl/ah-1255510.pdf)"
  forfait:
    niveau: 100
    # Eigenwoningforfait als percentage van de hele WOZ-waarde, afhankelijk van de WOZ-waarde.
    tabel:
      - { vanaf: 0, percentage: 0 }
      - { vanaf: 12500, percentage: 0.1 }
      - { vanaf: 25000, percentage: 0.2 }
      - { vanaf: 50000, percentage: 0.25 }
      - { vanaf: 75000, percentage: 0.35 }
    # Boven deze WOZ-waarde: het forfait op de grens, plus dit percentage van het deel daarboven.
    villataks: { vanaf: 1350000, percentage: 2.35 }
  # Hoogste tarief waartegen de aftrek eigen woning werkt. 0 = geen hypotheekrenteaftrek.
  aftrekMaxTarief: 37.56
  # Wet Hillen: is het forfait hoger dan de aftrekbare rente, dan is dit percentage van het verschil aftrekbaar.
  hillenAftrek: 71.867

overigeAftrekposten:
  bron: "Prototype: vaste schatting voor aftrekposten die niet apart in het model zitten (HANDOFF §2, zwakke plek 8). TODO: bron nodig."
  # Totaal in miljard euro per jaar. Wordt niet per huishouden berekend.
  budgetMld: 4.0
  niveau: 100

