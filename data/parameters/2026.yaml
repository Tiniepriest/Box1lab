    # Inkomensafhankelijke correctie: afbouw% × (rekeninkomen − inkomensijkpunt), per jaar.
    inkomensijkpunt: { eenpersoons: 23425, meerpersoons: 31500 }
    afbouw: { eenpersoons: 27, meerpersoons: 22 }
    maxVermogen: { alleenstaand: 38479, partners: 76958 }
  kindgebondenBudget:
    bron: "Dienst Toeslagen, Berekening kindgebonden budget 2026 (https://download.belastingdienst.nl/toeslagen/docs/berekening_kindgebonden_budget_tg0811z61fd.pdf)"
    niveau: 100
